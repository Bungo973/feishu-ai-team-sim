[project]
name = "ai-company-sim"
version = "0.1.0"
description = "AI 模拟公司 · 项目助理演练（飞书）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "httpx>=0.28.1",
    "openai>=3.36.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sim = "ai_company_sim.cli:main"

[project.optional-dependencies]
feishu = [
    "lark-oapi>=1.7.5",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
